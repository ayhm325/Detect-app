name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: detect
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/detect
      PW_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 && exit 0 || sleep 1
          done
          echo "Postgres did not become ready" && exit 1

      - name: Push Prisma schema to DB
        run: npx prisma db push

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Seed database for E2E
        run: |
          if [ -f prisma/seed.cjs ]; then
            echo "Running prisma/seed.cjs"
            node prisma/seed.cjs
          elif [ -f scripts/seed-e2e.js ]; then
            echo "Running scripts/seed-e2e.js"
            node scripts/seed-e2e.js
          elif [ -f scripts/seedAnalysisResult.js ]; then
            echo "Running scripts/seedAnalysisResult.js"
            node scripts/seedAnalysisResult.js
          else
            echo "No seed script found, skipping"
          fi
        shell: bash

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate Playwright storage state
        run: node playwright/generate-storage-state.mjs

      - name: Run E2E Test
        run: npm run test:e2e
